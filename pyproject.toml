[project]
name = "vectrax"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-coremedia>=12.2.2",
    "pyobjc-framework-libdispatch>=12.2.2",
]

[dependency-groups]
annotate = [
    "sam-2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
eval = [
    "trackeval",
]
ml = [
    "coremltools>=9.0",
    "onnxruntime>=1.30.0",
    "torch>=2.14.0",
]

[tool.uv.sources]
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval" }
sam-2 = { git = "https://github.com/facebookresearch/sam2", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
vectrax = "vectrax.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectrax"]

[tool.uv]
default-groups = "all"
